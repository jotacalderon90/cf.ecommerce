
  <!-- Basic Meta -->
  <meta name="description" content="{{data:doc.description}}" />
  <meta name="keywords" content="{{data:doc.keywords}}" />
  <meta name="author" content="{{data:doc.author}}" />
  <meta name="robots" content="index, follow" />
  
  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{data:doc.title}}" />
  <meta property="og:description" content="{{data:doc.description}}" />
  <meta property="og:image" content="{{data:doc.img}}" />
  <meta property="og:url" content="{{data:doc.url}}" />
  <meta property="og:site_name" content="{{data:doc.author}}" />
  <meta property="og:locale" content="es_ES" />
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{data:doc.title}}" />
  <meta name="twitter:description" content="{{data:doc.description}}" />
  <meta name="twitter:image" content="{{data:doc.img}}" />
  <meta name="twitter:site" content="{{data:doc.author}}" />
  <meta name="twitter:creator" content="{{data:doc.author}}" />
  
  <!-- Canonical -->
  <link rel="canonical" href="{{data:doc.url}}" />

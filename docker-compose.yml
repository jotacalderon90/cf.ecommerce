
services:

  ecommerce:
    build:
      context: .
      target: prod
    image: ecommerce:0.0.1
    container_name: ecommerce
    restart: unless-stopped
    mem_limit: 128M
    mem_reservation: 64M
    env_file:
      - .env.production
    volumes:
      - /var/log/trascender/ecommerce:/srv/cf.ecommerce/logs
    environment:
      NODE_ENV: "production"
      PORT: 2208
    ports:
      - "127.0.0.1:2208:2208"